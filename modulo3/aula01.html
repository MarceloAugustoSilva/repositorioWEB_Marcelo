<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Desconto na Tela</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f111a; color: white; padding: 20px; }
        .calculadora { background-color: #1a1d2e; padding: 20px; border-radius: 8px; max-width: 400px; margin: auto; }
        label { display: block; margin-top: 15px; margin-bottom: 5px; color: #805565; }
        input { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #3a3f58; background-color: #0f111a; color: white; box-sizing: border-box; }
        button { width: 100%; margin-top: 20px; padding: 12px; background-color: #68e75c; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #64e280; }
        .caixa-resultado { margin-top: 20px; padding: 15px; background-color: #252a41; border-radius: 4px; display: none; }
        .linha-codigo { color: #4ade80; font-family: monospace; margin: 5px 0; }
    </style>
</head>
<body>

    <div class="calculadora">
        <h2>Calculadora de desconto</h2>
        
        <label for="nome">Nome do cliente:</label>
        <input type="text" id="nome" value="Maria">

        <label for="preco">Preço do Produto (R$):</label>
        <input type="number" id="preco" value="200">

        <label for="desconto">Percentual de Desconto (%):</label>
        <input type="number" id="desconto" value="15">

        <!-- O onclick chama a função que está no JavaScript -->
        <button onclick="calcularDesconto()">Calcular</button>

        <!-- Esta div começa escondida e vai receber os textos do JS -->
        <div id="resultado" class="caixa-resultado"></div>
    </div>

    <!-- Ligando o arquivo JS -->
    <script src="aula01.js"></script>
</body>
</html>
