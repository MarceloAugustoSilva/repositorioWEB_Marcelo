<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Matrícula - FATEC</title>
</head>
<body>

    <header>
        <h1>Matrícula FATEC 2026</h1>
    </header>

    <main>
        <form action="#" method="POST">
            
            <fieldset>
                <legend>Dados Pessoais</legend>
                
                <p>
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" required minlength="5" placeholder="Digite seu nome">
                </p>
                
                <p>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required placeholder="exemplo@email.com">
                </p>
                
                <p>
                    <label for="nascimento">Data de Nascimento:</label>
                    <input type="date" id="nascimento" name="nascimento">
                </p>
                
                <p>
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" title="Digite no formato 123.456.789-00" placeholder="123.456.789-00">
                </p>
            </fieldset>

            <br>

            <fieldset>
                <legend>Dados Acadêmicos</legend>
                
                <p>
                    <label for="curso">Curso:</label>
                    <select id="curso" name="curso" required>
                        <option value="">Selecione um curso...</option>
                        <option value="ads">Análise e Desenvolvimento de Sistemas</option>
                        <option value="gti">Agronegócio</option>
                        <option value="log">GPI</option>
                        <option value="log">Gestão Ambiental</option>
                    </select>
                </p>
                
                <p>
                    <span>Período:</span><br>
                    <input type="radio" id="manha" name="periodo" value="manha" required>
                    <label for="manha">Manhã</label>
                    
                    <input type="radio" id="noite" name="periodo" value="noite" required>
                    <label for="noite">Noite</label>
                </p>
                
                <p>
                    <input type="checkbox" id="experiencia" name="experiencia" value="sim">
                    <label for="experiencia">Já programei antes</label>
                </p>
            </fieldset>

            <br>

            <p>
                <label for="observacoes">Observações:</label><br>
                <textarea id="observacoes" name="observacoes" rows="4" cols="50" placeholder="Escreva aqui se tiver alguma observação..."></textarea>
            </p>
            
            <p>
                <button type="submit">Enviar Matrícula</button>
            </p>

        </form>
    </main>

</body>
</html>
