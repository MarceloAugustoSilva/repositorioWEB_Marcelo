<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Jurássico</title>
    <link rel="stylesheet" href="aula08.css">
</head>
<body>

    <header class="header">
        <h1>Mundo Jurássico</h1>
        <nav class="navbar">
            <ul>
                <li><a href="#home">Início</a></li>
                <li><a href="#dinossauros">Galeria</a></li>
                <li><a href="#sobre">Sobre</a></li>
            </ul>
        </nav>
    </header>

    <main class="main">
        <section id="dinossauros" class="galeria-section">
            <h2>Nossos Dinossauros</h2>
            <p>Explore as feras do passado. Redimensione a tela (F12) para ver o layout se adaptando!</p>
            
            <section class="galeria">
                <article class="card">
                    <h3>Tiranossauro Rex</h3>
                    <figure>
                        <img src="imagens/dino01.jpg" alt="Tiranossauro Rex">
                        <figcaption>O predador mais temido.</figcaption>
                    </figure>
                </article>

                <article class="card">
                    <h3>Tricerátops</h3>
                    <figure>
                        <img src="imagens/dino02.jpg" alt="Tricerátops">
                        <figcaption>Com seus três chifres icônicos.</figcaption>
                    </figure>
                </article>

                <article class="card">
                    <h3>Velociraptor</h3>
                    <figure>
                        <img src="imagens/dino06.jpg" alt="Velociraptor">
                        <figcaption>Pequeno, rápido e inteligente.</figcaption>
                    </figure>
                </article>

                <article class="card">
                    <h3>Estegossauro</h3>
                    <figure>
                        <img src="imagens/dino03.jpg" alt="Estegossauro">
                        <figcaption>Famoso por suas placas ósseas nas costas.</figcaption>
                    </figure>
                </article>

                <article class="card">
                    <h3>Braquiossauro</h3>
                    <figure>
                        <img src="imagens/dino04.jpg" alt="Braquiossauro">
                        <figcaption>Um gigante herbívoro de pescoço longo.</figcaption>
                    </figure>
                </article>

                <article class="card">
                    <h3>Espinossauro</h3>
                    <figure>
                        <img src="imagens/dino05.jpg" alt="Espinossauro">
                        <figcaption>Um caçador formidável nos rios e lagos.</figcaption>
                    </figure>
                </article>
            </section>
        </section>
    </main>

    <footer class="footer">
        <p>FATEC 2026 - Galeria Responsiva de Dinossauros</p>
    </footer>

</body>
</html>
